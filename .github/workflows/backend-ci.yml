name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Generate Ent
        working-directory: backend
        run: go generate ./ent
      - name: Format Go sources
        run: git ls-files -z '*.go' | xargs -0 gofmt -w
      - name: Generate Wire
        working-directory: backend
        run: go generate ./cmd/server
      - name: Export generated source changes
        if: always()
        run: git diff --binary > generated-sources.patch
      - name: Upload generated source changes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-sources-${{ github.sha }}
          path: generated-sources.patch
          retention-days: 7
      - name: Verify generated sources are committed
        run: git diff --exit-code

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh -n deploy/prompt-audit-retention.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Generate Ent and Wire
        working-directory: backend
        run: go generate ./ent ./cmd/server
      - name: Unit tests
        id: unit
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        if: ${{ !cancelled() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        working-directory: backend
        run: make test-integration

  proxy-pool-import:
    needs: [test, golangci-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build controlled proxy pool importer
        working-directory: backend
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o proxy-pool-import.exe ./cmd/proxy-pool-import
          sha256sum proxy-pool-import.exe > proxy-pool-import.exe.sha256
      - name: Upload proxy pool importer
        uses: actions/upload-artifact@v7
        with:
          name: proxy-pool-import-windows-amd64-${{ github.sha }}
          path: |
            backend/proxy-pool-import.exe
            backend/proxy-pool-import.exe.sha256
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Full frontend regression suite
        working-directory: frontend
        run: pnpm run test:run
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
