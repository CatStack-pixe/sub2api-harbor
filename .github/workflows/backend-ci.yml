name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_routing_baseline:
        description: Record the routing baseline from pinned pre-integration main
        type: boolean
        default: false
      diagnose_routing:
        description: Export detailed routing differences while all normal gates run
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      # The generation directives use the module graph, including x/tools v0.50.0,
      # so Ent and Wire read the export format produced by this Go toolchain.
      - name: Generate Ent
        working-directory: backend
        run: go generate ./ent
      - name: Format Go sources
        run: git ls-files -z '*.go' | xargs -0 gofmt -w
      - name: Generate Wire
        working-directory: backend
        run: go generate ./cmd/server
      - name: Export generated source changes
        if: always()
        run: |
          git ls-files -z --others --exclude-standard -- backend/ent backend/cmd/server \
            | xargs -0 -r git add --intent-to-add --
          git diff --binary > generated-sources.patch
      - name: Upload generated source changes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-sources-${{ github.sha }}
          path: generated-sources.patch
          retention-days: 7
      - name: Verify generated sources are committed
        run: git diff --exit-code

  record-routing-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.record_routing_baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      - name: Record pinned historical routing baseline
        id: record
        working-directory: .
        run: python backend/internal/service/testdata/record_upstream_protocol_routing_main.py
      # Independent of the normal gates; never publish the checkout's old fixture
      # if recording the pinned source fails.
      - name: Upload routing baseline
        if: ${{ always() && steps.record.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: routing-baseline
          path: backend/internal/service/testdata/upstream_protocol_routing_main_golden.json
          if-no-files-found: error
          retention-days: 7

  diagnose-routing:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Generate Ent
        working-directory: backend
        run: go generate ./ent
      - name: Compare historical routing
        working-directory: backend
        env:
          ROUTING_MATRIX_DIFFERENCES_OUTPUT: ${{ runner.temp }}/routing-differences.json
        run: go test -tags unit ./internal/service/ -run '^(TestUpstreamProtocolRoutingMatrixMatchesMainGolden|TestWalletErrorsForwardingMapsModelOnce|TestClineWalletWriteFailuresStayIsolatedThroughForwarding|TestClineUsageProbe.*|TestHandleUpstreamError_Cline.*)$' -count=1
      - name: Upload detailed comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routing-diagnostic
          path: ${{ runner.temp }}/routing-differences.json
          if-no-files-found: error
          retention-days: 7

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh -n deploy/prompt-audit-retention.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      - name: Generate Ent and Wire
        working-directory: backend
        run: go generate ./ent ./cmd/server
      - name: Unit tests
        working-directory: backend
        env:
          ROUTING_MATRIX_DIFFERENCES_OUTPUT: ${{ runner.temp }}/routing-differences.json
        run: make test-unit
      - name: Upload routing comparison evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: routing-differences-${{ github.sha }}
          path: ${{ runner.temp }}/routing-differences.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      - name: Generate Ent and Wire
        working-directory: backend
        run: go generate ./ent ./cmd/server
      - name: Integration tests
        working-directory: backend
        run: make test-integration
  proxy-pool-import:
    needs: [generated, test, integration, golangci-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      - name: Generate Ent and Wire
        working-directory: backend
        run: go generate ./ent ./cmd/server
      - name: Build controlled proxy pool importer
        working-directory: backend
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o proxy-pool-import.exe ./cmd/proxy-pool-import
          sha256sum proxy-pool-import.exe > proxy-pool-import.exe.sha256
      - name: Upload proxy pool importer
        uses: actions/upload-artifact@v7
        with:
          name: proxy-pool-import-windows-amd64-${{ github.sha }}
          path: |
            backend/proxy-pool-import.exe
            backend/proxy-pool-import.exe.sha256
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, typecheck and critical Vitest
        run: make test-frontend
      - name: Full frontend regression suite
        working-directory: frontend
        run: pnpm run test:run
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: test "$(go env GOVERSION)" = "go1.27.2"
      - name: Generate Ent and Wire
        working-directory: backend
        run: go generate ./ent ./cmd/server
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
