name: Build Container Image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/catstack-pixe/sub2api-harbor

jobs:
  verify:
    runs-on: ubuntu-latest
    container: golang:1.26.5-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Check Go formatting
        run: |
          files="backend/internal/service/openai_codex_protocol_compat_test.go \
            backend/internal/service/openai_codex_transform.go \
            backend/internal/service/openai_gateway_forward.go \
            backend/internal/service/openai_gateway_request_body.go \
            backend/internal/service/openai_gateway_scheduling.go \
            backend/internal/service/openai_gateway_service.go \
            backend/internal/service/openai_gateway_service_test.go \
            backend/internal/service/openai_ws_forwarder_logutil.go \
            backend/internal/service/openai_ws_forwarder_payload.go"
          unformatted="$(gofmt -l $files)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Test Codex protocol compatibility
        working-directory: backend
        run: >-
          go test ./internal/service -run
          'TestCodex(SessionHeadersDriveSchedulingAndWebSocketResolution|InstallationIDIsOwnedByOAuthAccount)|TestOpenAIAllowedHeadersIncludeCodexSessionHeaders|TestOpenAIBuildUpstreamRequestCompactForcesJSONAcceptForOAuth'

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
