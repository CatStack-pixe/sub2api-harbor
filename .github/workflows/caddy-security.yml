name: Caddy Security Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      caddyfile:
        description: Repository path to the Caddyfile containing the direct block
        type: string
        default: deploy/Caddyfile

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out pinned official Caddy source
        uses: actions/checkout@v6
        with:
          repository: caddyserver/caddy
          # v2.11.7 annotated tag 87c43dc4f54861ec7e54302cfb2ad3e34508b6dc
          # resolves to this exact commit; never build a moving tag or branch.
          ref: 72dd0fb067f6d7826c7f79907670ba4a713bfe37
          path: build/caddy-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test artifact verification and packaging
        run: python -B -m unittest discover -s .github/security-tools -p test_build_caddy.py -v
      - name: Set up exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: false
          cache-dependency-path: build/caddy-source/go.sum
      # Compilation and all executable checks happen on this runner.
      # Adapt only: do not provision certificates, start Caddy, or contact a host.
      - name: Build, inspect and adapt Caddyfile offline
        env:
          CADDYFILE: ${{ inputs.caddyfile || 'deploy/Caddyfile' }}
        run: >-
          python -B .github/security-tools/build_caddy.py
          --source-dir build/caddy-source
          --output-dir dist/caddy-security
          --caddyfile "$CADDYFILE"
          --project-revision "${{ github.sha }}"
      - name: Upload verified deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: caddy-security-${{ github.sha }}
          path: dist/caddy-security/
          if-no-files-found: error
          retention-days: 30
